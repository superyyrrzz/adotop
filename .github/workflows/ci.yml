name: ci
on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo — no commits, no releases, no comments.
# Declared explicitly so CodeQL's least-privilege check is satisfied
# and so a future repo-default change can't accidentally grant write.
permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # Lint runs once on Linux. golangci-lint is platform-independent;
  # spending three runners' time on identical output isn't useful.
  # Config lives in .golangci.yml at the repo root.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12

