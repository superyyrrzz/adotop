# GoReleaser config for adotop. Build prebuilt binaries on tag push.
#
# Trigger: `git tag v0.1.0 && git push --tags` and the
# .github/workflows/release.yml workflow drives goreleaser to attach
# artifacts to a GitHub Release. No manual binary uploads needed.
#
# Test locally without publishing:
#   goreleaser release --snapshot --clean

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: adotop
    main: ./cmd/adotop
    binary: adotop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Trim path info for reproducibility; embed version + commit so
    # `adotop --version` (when added) reports the right release.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    # Windows ships as .zip — that's the conventional Windows archive.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch

# Scoop bucket — the manifest committed back into this repo at
# bucket/adotop.json on each tag. Users add the bucket once
# (scoop bucket add adotop https://github.com/superyyrrzz/adotop)
# and `scoop install adotop` resolves to the latest GitHub release.
#
# Goreleaser uses GITHUB_TOKEN by default, so no extra secret is
# needed — the same token release.yml already exposes is enough to
# push the manifest commit. If you ever split the bucket into a
# separate repo, swap `repository.name` and add a personal-access
# token with cross-repo write scope.
scoops:
  - name: adotop
    repository:
      owner: superyyrrzz
      name: adotop
      branch: main
    directory: bucket
    homepage: https://github.com/superyyrrzz/adotop
    description: Terminal UI for Azure DevOps pull requests
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "scoop: bump adotop to {{ .Tag }}"

# Homebrew tap — same shape as the scoop bucket above, but for
# macOS (and Linux via brew). The formula is committed back to
# Formula/adotop.rb on each tag. Users tap once:
#
#   brew tap superyyrrzz/adotop https://github.com/superyyrrzz/adotop
#   brew install adotop
#
# We point the tap at this same repo (no separate homebrew-adotop
# repo) so there's one place to send PRs and the default
# GITHUB_TOKEN is enough to push the formula commit. Convention
# would split into a `homebrew-adotop` repo for a project with many
# formulae; for one binary it's friction without payoff.
brews:
  - name: adotop
    repository:
      owner: superyyrrzz
      name: adotop
      branch: main
    directory: Formula
    homepage: https://github.com/superyyrrzz/adotop
    description: Terminal UI for Azure DevOps pull requests
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "brew: bump adotop to {{ .Tag }}"
    test: |
      system "#{bin}/adotop --version"
